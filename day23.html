<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        async function display(){
            let api="http://localhost:3000/student";
            const myobj=await fetch(api);
            const MyData=await myobj.json();
            let Table=`<table border="1" width="500" bgcolor="pink">
                <tr>
                    <td>Rollno</td>
                    <td>Name</td>
                    <td>City</td>
                    <td>Fees</td>
               </tr>
            `
            MyData.map((key)=>{
                Table+=`
                 <tr>
                    <td>${key.rollno}</td>
                    <td>${key.name}</td>
                    <td>${key.city}</td>
                    <td>${key.fees}</td>
               </tr>
                `
            })
            Table+="</table>";
            document.getElementById("demo").innerHTML=Table;
        }
    </script>
</head>
<body>
    <button onclick="display()">show Data</button>
    <hr>
    <p id="demo"></p>
</body>
</html>
