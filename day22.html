   <h1 id="demo"> welcome</h1>
   <script>
    const student=[
        {
            "rollno":121,
            "name":"saurabh",
            "city":"bhopal",
            "fees":45600
        },
        {
            "rollno":122,
            "name":"sarth",
            "city":"indore",
            "fees":45600
        },
        {
            "rollno":123,
            "name":"mohan",
            "city":"jabalpur",
            "fees":45800
        },

        {
            "rollno":124,
            "name":"rahul",
            "city":"rewa",
            "fees":45400
        }

    ]
    let Mytab=`<table border="1" width="500">
        <tr>
            <th>Rollno</th>
            <th>Name</th>
            <th>City</th>
            <th>Fees</th>
        </tr>`
        student.map((key)=>{
            Mytab+=`<tr>
                <td>${key.rollno}</td>
                <td>${key.name}</td>
                <td>${key.city}</td>
                <td>${key.fees}</td>
                </tr>`

        },)
        Mytab+="</table>";
        document.getElementById("demo").innerHTML=Mytab;
   </script>
